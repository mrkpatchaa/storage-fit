name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check smoke-test JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("tests/smoke.html").read_text()
          scripts = re.findall(r"<script>([\s\S]*?)</script>", source, flags=re.I)
          assert scripts, "smoke test script is missing"
          Path("/tmp/storage-fit-smoke.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/storage-fit-smoke.js

      - name: Check static app structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          assert 'href="styles.css"' in html, "index.html must load styles.css"
          assert 'src="app.js"' in html, "index.html must load app.js"
          assert "<style>" not in html.lower(), "keep application CSS in styles.css"
          assert "<script>" not in html.lower(), "keep application JS in app.js"
          assert Path("tests/smoke.html").is_file(), "browser smoke test is missing"
          print("Static structure looks good.")
          PY
