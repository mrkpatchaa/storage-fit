name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check shared-viewer JavaScript syntax
        run: node --check share.js

      - name: Check shared 3D renderer JavaScript syntax
        run: node --check view3d.js

      - name: Check smoke-test JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("tests/smoke.html").read_text()
          scripts = re.findall(r"<script>([\s\S]*?)</script>", source, flags=re.I)
          assert scripts, "smoke test script is missing"
          Path("/tmp/storage-fit-smoke.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/storage-fit-smoke.js

      - name: Check QR encoder syntax
        run: node --check qr.js

      - name: Check theme script syntax
        run: node --check theme.js

      - name: Run QR encoder tests
        run: node tests/qr-test.js

      - name: Check service worker syntax
        run: node --check sw.js

      - name: Run offline (service worker) tests
        run: node tests/service-worker-test.js

      - name: Check browser-smoke runner syntax
        run: bash -n tests/run-browser-smoke.sh

      - name: Run browser smoke tests
        run: bash tests/run-browser-smoke.sh

      - name: Check static app structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          assert 'href="styles.css"' in html, "index.html must load styles.css"
          assert 'src="app.js"' in html, "index.html must load app.js"
          assert "<style>" not in html.lower(), "keep application CSS in styles.css"
          assert "<script>" not in html.lower(), "keep application JS in app.js"
          assert Path("tests/smoke.html").is_file(), "browser smoke test is missing"
          assert Path("share.html").is_file(), "shared-plan viewer is missing"
          assert Path("share.js").is_file(), "shared-plan viewer script is missing"
          share = Path("share.html").read_text()
          assert 'href="styles.css"' in share, "share.html must load styles.css"
          assert 'src="share.js"' in share, "share.html must load share.js"
          assert Path("view3d.js").is_file(), "shared 3D renderer is missing"
          assert 'src="view3d.js"' in html, "index.html must load view3d.js"
          assert 'src="view3d.js"' in share, "share.html must load view3d.js"
          assert 'rel="manifest"' in html, "index.html must link the web app manifest"
          assert 'src="qr.js"' in html, "index.html must load the QR encoder"
          readme = Path("README.md").read_text()
          assert readme.startswith("# Storage Fit\n"), "README must start with the project title"
          assert readme.count("\n# Storage Fit\n") == 0, "README contains a duplicated project title"
          print("Static structure looks good.")
          PY
