<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storage Fit Smoke Tests</title>
  <style>
    body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
    .pass{color:#176b45}.fail{color:#a13232}code{background:#f3f3ef;padding:2px 5px;border-radius:5px}
    iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <h1>Storage Fit smoke tests</h1>
  <p>Loads the real app and checks core browser-side helpers without a build step.</p>
  <div id="results">Running…</div>
  <iframe id="app" src="../index.html?smoke-test=1"></iframe>
<script>
(function(){
  var backup={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);backup[k]=localStorage.getItem(k);}
  localStorage.clear();

  var rows=[];
  function result(ok,name,detail){rows.push({ok:ok,name:name,detail:detail||""});}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}

  var frame=document.getElementById("app");
  frame.addEventListener("load",function(){
    var w=frame.contentWindow;
    try{
      var api=w.StorageFitTest;
      result(!!api,"smoke-test API is exposed only for the test page");
      result(same(api.parseDimensionString("38 x 76 x 30 cm"),[38,76,30]),"compact dimensions");
      result(same(api.parseLabeledDimensions("Width: 38 cm Depth: 76 cm Height: 30 cm"),[38,76,30]),"IKEA labeled dimensions");
      result(same(api.parseLabeledDimensions("Largeur 38 cm Profondeur 76 cm Hauteur 30 cm"),[38,76,30]),"French labeled dimensions");
      result(api.normalizedSku("405.220.88")==="40522088","SKU punctuation normalization");
      var tracked="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/?utm_source=test#details";
      var clean="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/";
      result(api.canonicalProductUrl(tracked)===api.canonicalProductUrl(clean),"tracking URLs canonicalize to one product");
      result(api.retailerName(clean)==="IKEA","retailer detection");
      var info=api.ikeaUrlInfo(clean);
      result(info.sku==="405.220.88","IKEA article number",info.sku||"missing");
      result(same(api.normalizeProductDimensions([380,760,300],"mm"),[38,76,30]),"unit conversion mm to cm");
      result(api.safeUrl("javascript:alert(1)")==="","unsafe URL rejection");
      var valid={storages:[{id:"s",name:"Drawer",w:67,d:26,h:13,obstacles:[]}],boxes:[{id:"b",name:"Box",w:10,d:10,h:5}],savedPlans:[]};
      result(api.validateBackupState(valid)==="","backup validation accepts valid state");
      result(api.validateBackupState({storages:"bad",boxes:[]})!=="","backup validation rejects invalid state");

      var base={x:0,y:0,z:0,w:20,d:20,h:10};
      var touching={x:2,y:2,z:10,w:10,d:10,h:5};
      var colliding={x:2,y:2,z:9,w:10,d:10,h:5};
      var overhang={x:15,y:2,z:10,w:10,d:10,h:5};
      result(api.overlap3D(base,touching,0)===false,"stacked faces may touch vertically");
      result(api.overlap3D(base,colliding,0)===true,"3D overlap detects vertical penetration");
      result(api.footprintContains(base,touching)===true,"full-footprint support accepted");
      result(api.footprintContains(base,overhang)===false,"overhanging stack rejected");
      var stock=api.purchaseBreakdown(5,2,30);
      result(stock.ownedUsed===2&&stock.buyQty===3&&stock.subtotal===90,"owned inventory reduces purchase quantity");
      var covered=api.purchaseBreakdown(3,5,30);
      result(covered.ownedUsed===3&&covered.buyQty===0&&covered.subtotal===0,"owned inventory can fully cover a layout");
      var shoppingState={shoppingBought:{b1:3.9,b2:-2,b3:"4"}};
      api.normalizeShoppingBought(shoppingState);
      result(shoppingState.shoppingBought.b1===3&&shoppingState.shoppingBought.b3===4&&!shoppingState.shoppingBought.b2,"shopping progress normalizes to non-negative whole quantities");
      var projectCounts=api.aggregateRequiredCounts([
        {layout:[{typeId:"b1"},{typeId:"b1"},{typeId:"b2"}]},
        {layout:[{typeId:"b1"},{typeId:"b2"},{typeId:"b2"}]}
      ]);
      result(projectCounts.b1===3&&projectCounts.b2===3,"chosen-plan quantities aggregate across storage spaces");
      var legacyChoice={
        savedPlans:[{id:"p1",storageId:"s1"},{id:"p2",storageId:"s2"}],
        chosenPlanId:"p2"
      };
      api.normalizeChosenPlanSelections(legacyChoice);
      result(legacyChoice.chosenPlanIds.s2==="p2"&&!("chosenPlanId" in legacyChoice),"legacy single chosen plan migrates to its storage");
      var installPlans=[
        {id:"p1",storageId:"s1",layout:[{typeId:"b1"},{typeId:"b1"}]},
        {id:"p2",storageId:"s2",layout:[{typeId:"b1"},{typeId:"b1"}]}
      ];
      var firstReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s1","s2"]);
      result(firstReady.entries[0].status==="ready"&&firstReady.entries[1].status==="waiting","install queue allocates limited stock by priority");
      var secondReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s2","s1"]);
      result(secondReady.entries[0].storageId==="s2"&&secondReady.entries[0].status==="ready"&&secondReady.entries[1].status==="waiting","reordering changes which storage is ready");
      var reserved=api.computeInstallAllocation(installPlans,{b1:4},{s1:"p1"},["s1","s2"]);
      result(reserved.entries[0].status==="installed"&&reserved.entries[1].status==="ready","installed plans reserve inventory before ready allocation");
      var installState={
        storages:[{id:"s1"},{id:"s2"}],
        savedPlans:installPlans,
        chosenPlanIds:{s1:"p2",s2:"p2"},
        installedPlanIds:{s1:"p1",s2:"p2"},
        installOrder:["s2","s1","s2"]
      };
      api.normalizeInstallState(installState);
      result(!installState.installedPlanIds.s1&&installState.installedPlanIds.s2==="p2","stale installed status is removed when chosen plan changes");
      result(installState.installOrder.length===2&&installState.installOrder[0]==="s2","install order is deduplicated and keeps chosen storages");
      result(JSON.stringify(api.repeatStorageNames("Drawer",3))===JSON.stringify(["Drawer 2","Drawer 3","Drawer 4"]),"plain storage names repeat with readable numbering");
      result(JSON.stringify(api.repeatStorageNames("Drawer 07",2))===JSON.stringify(["Drawer 08","Drawer 09"]),"numbered storage names preserve zero padding");
      var seq=0,idFactory=function(prefix){seq+=1;return prefix+"-"+seq};
      var storageClone=api.cloneStorageDefinition(
        {id:"s1",name:"Drawer 1",w:67,d:26,h:13,furnitureId:"f1",obstacles:[{id:"o1",name:"Rail",x:1,y:2,w:3,d:4,h:5}]},
        {name:"Drawer 2",idFactory:idFactory}
      );
      result(storageClone.id!=="s1"&&storageClone.name==="Drawer 2","storage clone gets a fresh ID and requested name");
      result(storageClone.obstacles.length===1&&storageClone.obstacles[0].id!=="o1"&&storageClone.obstacles[0].name==="Rail","storage clone deep-copies blocked zones with fresh IDs");
      var seq2=0,idFactory2=function(prefix){seq2+=1;return prefix+"-"+seq2};
      var furnClone=api.cloneFurnitureDefinition(
        {id:"f1",roomId:"r1",name:"Wardrobe"},
        [{id:"s1",name:"Left drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]},{id:"s2",name:"Right drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]}],
        {name:"Wardrobe copy",idFactory:idFactory2}
      );
      result(furnClone.furniture.id!=="f1"&&furnClone.storages.length===2,"furniture clone creates a fresh furniture and all child storage spaces");
      result(furnClone.storages.every(function(x){return x.furnitureId===furnClone.furniture.id}),"cloned storage spaces point to the cloned furniture");
      result(!("savedPlans" in furnClone)&&!furnClone.storages.some(function(x){return "installed" in x||"chosen" in x}),"structural clones do not carry planning or installation completion state");
      var legacy={storages:[{id:"s1",name:"Drawer",w:10,d:10,h:10}],boxes:[{id:"b1",name:"Box",w:5,d:5,h:5}],rooms:[],furniture:[],selectedStorage:"s1"};
      api.ensureHomeHierarchy(legacy);
      result(legacy.rooms.length===1,"legacy data gets a fallback room");
      result(legacy.furniture.length===1,"legacy data gets fallback furniture");
      result(legacy.storages[0].furnitureId===legacy.furniture[0].id,"legacy storage is assigned to fallback furniture");
      result(legacy.selectedRoom===legacy.rooms[0].id&&legacy.selectedFurniture===legacy.furniture[0].id,"hierarchy selection follows the active storage");
    }catch(e){
      result(false,"test harness exception",e.message);
    }finally{
      localStorage.clear();
      Object.keys(backup).forEach(function(key){localStorage.setItem(key,backup[key]);});
    }

    var pass=rows.filter(function(x){return x.ok;}).length;
    var html="<p><strong>"+pass+"/"+rows.length+" passed</strong></p><ul>";
    html+=rows.map(function(r){
      return '<li class="'+(r.ok?"pass":"fail")+'">'+(r.ok?"✓":"✗")+" "+r.name+(r.detail?" — <code>"+r.detail+"</code>":"")+"</li>";
    }).join("");
    html+="</ul>";
    document.getElementById("results").innerHTML=html;
  },{once:true});
})();
</script>
</body>
</html>
