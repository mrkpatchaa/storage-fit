<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storage Fit Smoke Tests</title>
  <style>
    body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
    .pass{color:#176b45}.fail{color:#a13232}code{background:#f3f3ef;padding:2px 5px;border-radius:5px}
    iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <h1>Storage Fit smoke tests</h1>
  <p>Loads the real app and checks core browser-side helpers without a build step.</p>
  <div id="results">Running…</div>
  <iframe id="app" src="../index.html?smoke-test=1"></iframe>
<script>
(function(){
  var backup={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);backup[k]=localStorage.getItem(k);}
  localStorage.clear();

  var rows=[];
  function result(ok,name,detail){rows.push({ok:ok,name:name,detail:detail||""});}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}

  var frame=document.getElementById("app");
  frame.addEventListener("load",function(){
    var w=frame.contentWindow;
    try{
      var api=w.StorageFitTest;
      result(!!api,"smoke-test API is exposed only for the test page");
      result(same(api.parseDimensionString("38 x 76 x 30 cm"),[38,76,30]),"compact dimensions");
      result(same(api.parseLabeledDimensions("Width: 38 cm Depth: 76 cm Height: 30 cm"),[38,76,30]),"IKEA labeled dimensions");
      result(same(api.parseLabeledDimensions("Largeur 38 cm Profondeur 76 cm Hauteur 30 cm"),[38,76,30]),"French labeled dimensions");
      result(api.normalizedSku("405.220.88")==="40522088","SKU punctuation normalization");
      var tracked="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/?utm_source=test#details";
      var clean="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/";
      result(api.canonicalProductUrl(tracked)===api.canonicalProductUrl(clean),"tracking URLs canonicalize to one product");
      result(api.retailerName(clean)==="IKEA","retailer detection");
      var info=api.ikeaUrlInfo(clean);
      result(info.sku==="405.220.88","IKEA article number",info.sku||"missing");
      result(same(api.normalizeProductDimensions([380,760,300],"mm"),[38,76,30]),"unit conversion mm to cm");
      result(api.safeUrl("javascript:alert(1)")==="","unsafe URL rejection");
      var valid={storages:[{id:"s",name:"Drawer",w:67,d:26,h:13,obstacles:[]}],boxes:[{id:"b",name:"Box",w:10,d:10,h:5}],savedPlans:[]};
      result(api.validateBackupState(valid)==="","backup validation accepts valid state");
      result(api.validateBackupState({storages:"bad",boxes:[]})!=="","backup validation rejects invalid state");

      var base={x:0,y:0,z:0,w:20,d:20,h:10};
      var touching={x:2,y:2,z:10,w:10,d:10,h:5};
      var colliding={x:2,y:2,z:9,w:10,d:10,h:5};
      var overhang={x:15,y:2,z:10,w:10,d:10,h:5};
      result(api.overlap3D(base,touching,0)===false,"stacked faces may touch vertically");
      result(api.overlap3D(base,colliding,0)===true,"3D overlap detects vertical penetration");
      result(api.footprintContains(base,touching)===true,"full-footprint support accepted");
      result(api.footprintContains(base,overhang)===false,"overhanging stack rejected");
      var stock=api.purchaseBreakdown(5,2,30);
      result(stock.ownedUsed===2&&stock.buyQty===3&&stock.subtotal===90,"owned inventory reduces purchase quantity");
      var covered=api.purchaseBreakdown(3,5,30);
      result(covered.ownedUsed===3&&covered.buyQty===0&&covered.subtotal===0,"owned inventory can fully cover a layout");
      var shoppingState={shoppingBought:{b1:3.9,b2:-2,b3:"4"}};
      api.normalizeShoppingBought(shoppingState);
      result(shoppingState.shoppingBought.b1===3&&shoppingState.shoppingBought.b3===4&&!shoppingState.shoppingBought.b2,"shopping progress normalizes to non-negative whole quantities");
      var projectCounts=api.aggregateRequiredCounts([
        {layout:[{typeId:"b1"},{typeId:"b1"},{typeId:"b2"}]},
        {layout:[{typeId:"b1"},{typeId:"b2"},{typeId:"b2"}]}
      ]);
      result(projectCounts.b1===3&&projectCounts.b2===3,"chosen-plan quantities aggregate across storage spaces");
      var legacyChoice={
        savedPlans:[{id:"p1",storageId:"s1"},{id:"p2",storageId:"s2"}],
        chosenPlanId:"p2"
      };
      api.normalizeChosenPlanSelections(legacyChoice);
      result(legacyChoice.chosenPlanIds.s2==="p2"&&!("chosenPlanId" in legacyChoice),"legacy single chosen plan migrates to its storage");
      var installPlans=[
        {id:"p1",storageId:"s1",layout:[{typeId:"b1"},{typeId:"b1"}]},
        {id:"p2",storageId:"s2",layout:[{typeId:"b1"},{typeId:"b1"}]}
      ];
      var firstReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s1","s2"]);
      result(firstReady.entries[0].status==="ready"&&firstReady.entries[1].status==="waiting","install queue allocates limited stock by priority");
      var secondReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s2","s1"]);
      result(secondReady.entries[0].storageId==="s2"&&secondReady.entries[0].status==="ready"&&secondReady.entries[1].status==="waiting","reordering changes which storage is ready");
      var reserved=api.computeInstallAllocation(installPlans,{b1:4},{s1:"p1"},["s1","s2"]);
      result(reserved.entries[0].status==="installed"&&reserved.entries[1].status==="ready","installed plans reserve inventory before ready allocation");
      var installState={
        storages:[{id:"s1"},{id:"s2"}],
        savedPlans:installPlans,
        chosenPlanIds:{s1:"p2",s2:"p2"},
        installedPlanIds:{s1:"p1",s2:"p2"},
        installOrder:["s2","s1","s2"]
      };
      api.normalizeInstallState(installState);
      result(!installState.installedPlanIds.s1&&installState.installedPlanIds.s2==="p2","stale installed status is removed when chosen plan changes");
      result(installState.installOrder.length===2&&installState.installOrder[0]==="s2","install order is deduplicated and keeps chosen storages");
      result(JSON.stringify(api.repeatStorageNames("Drawer",3))===JSON.stringify(["Drawer 2","Drawer 3","Drawer 4"]),"plain storage names repeat with readable numbering");
      result(JSON.stringify(api.repeatStorageNames("Drawer 07",2))===JSON.stringify(["Drawer 08","Drawer 09"]),"numbered storage names preserve zero padding");
      var seq=0,idFactory=function(prefix){seq+=1;return prefix+"-"+seq};
      var storageClone=api.cloneStorageDefinition(
        {id:"s1",name:"Drawer 1",w:67,d:26,h:13,furnitureId:"f1",obstacles:[{id:"o1",name:"Rail",x:1,y:2,w:3,d:4,h:5}]},
        {name:"Drawer 2",idFactory:idFactory}
      );
      result(storageClone.id!=="s1"&&storageClone.name==="Drawer 2","storage clone gets a fresh ID and requested name");
      result(storageClone.obstacles.length===1&&storageClone.obstacles[0].id!=="o1"&&storageClone.obstacles[0].name==="Rail","storage clone deep-copies blocked zones with fresh IDs");
      var dividerStorage={id:"ds",name:"Divider drawer",w:100,d:50,h:12,furnitureId:"f1",obstacles:[],dividers:[
        {id:"dv",orientation:"vertical",position:40,thickness:2,h:10},
        {id:"dh",orientation:"horizontal",position:20,thickness:1,h:8}
      ]};
      var dividerRects=api.dividerRectsForStorage(dividerStorage);
      result(dividerRects.length===2&&dividerRects[0].x===39&&dividerRects[0].w===2&&dividerRects[0].d===50,"vertical divider becomes a centered front-to-back physical wall");
      result(dividerRects[1].y===19.5&&dividerRects[1].d===1&&dividerRects[1].w===100,"horizontal divider becomes a centered left-to-right physical wall");
      var edgeDivider=api.dividerRectsForStorage({id:"edge",w:10,d:10,h:5,dividers:[{id:"d",orientation:"vertical",position:0,thickness:2,h:5}]})[0];
      result(edgeDivider.x===0&&edgeDivider.w===1,"divider thickness is clipped correctly at a storage wall");
      var physical=api.physicalObstaclesForStorage({id:"ps",w:100,d:50,h:12,obstacles:[{id:"o",x:1,y:1,w:2,d:2,h:2}],dividers:dividerStorage.dividers});
      result(physical.length===3&&physical.filter(function(x){return x.kind==="divider"}).length===2,"optimizer geometry combines blocked zones and dividers");
      var seqDivider=0,dividerClone=api.cloneStorageDefinition(dividerStorage,{idFactory:function(prefix){seqDivider+=1;return prefix+"-d"+seqDivider}});
      result(dividerClone.dividers.length===2&&dividerClone.dividers[0].id!=="dv"&&dividerClone.dividers[0].position===40,"storage cloning deep-copies dividers with fresh IDs");
      var seq2=0,idFactory2=function(prefix){seq2+=1;return prefix+"-"+seq2};
      var furnClone=api.cloneFurnitureDefinition(
        {id:"f1",roomId:"r1",name:"Wardrobe"},
        [{id:"s1",name:"Left drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]},{id:"s2",name:"Right drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]}],
        {name:"Wardrobe copy",idFactory:idFactory2}
      );
      result(furnClone.furniture.id!=="f1"&&furnClone.storages.length===2,"furniture clone creates a fresh furniture and all child storage spaces");
      result(furnClone.storages.every(function(x){return x.furnitureId===furnClone.furniture.id}),"cloned storage spaces point to the cloned furniture");
      result(!("savedPlans" in furnClone)&&!furnClone.storages.some(function(x){return "installed" in x||"chosen" in x}),"structural clones do not carry planning or installation completion state");
      var matchSource={id:"s1",furnitureId:"f1",name:"Drawer A",w:67,d:26,h:13,obstacles:[{id:"o1",name:"Left rail",x:0,y:0,w:2,d:26,h:2}]};
      var sameGeometry={id:"s2",furnitureId:"f1",name:"Drawer B",w:67,d:26,h:13,obstacles:[{id:"different",name:"Different label",x:0,y:0,w:2,d:26,h:2}]};
      var changedObstacle={id:"s3",furnitureId:"f1",name:"Drawer C",w:67,d:26,h:13,obstacles:[{id:"o3",name:"Rail",x:0,y:0,w:3,d:26,h:2}]};
      var otherFurniture={id:"s4",furnitureId:"f2",name:"Drawer D",w:67,d:26,h:13,obstacles:[{id:"o4",name:"Rail",x:0,y:0,w:2,d:26,h:2}]};
      result(api.storageStructureSignature(matchSource)===api.storageStructureSignature(sameGeometry),"matching ignores obstacle IDs and labels");
      result(api.storageStructureSignature(matchSource)!==api.storageStructureSignature(changedObstacle),"matching detects obstacle geometry changes");
      var withDivider={id:"sd1",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"d1",orientation:"vertical",position:30,thickness:1,h:13}]};
      var sameDivider={id:"sd2",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"other",orientation:"vertical",position:30,thickness:1,h:13}]};
      var movedDivider={id:"sd3",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"d3",orientation:"vertical",position:31,thickness:1,h:13}]};
      result(api.storageStructureSignature(withDivider)===api.storageStructureSignature(sameDivider),"structural matching ignores divider IDs");
      result(api.storageStructureSignature(withDivider)!==api.storageStructureSignature(movedDivider),"structural matching detects divider geometry changes");
      var siblings=api.matchingSiblingStorages(matchSource,[matchSource,sameGeometry,changedObstacle,otherFurniture]);
      result(siblings.length===1&&siblings[0].id==="s2","propagation targets only structurally identical siblings in the same furniture");
      var unlabeled=[{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5}];
      var labeled=[{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5,label:"Socks"}];
      result(api.canonicalPlanLayout(unlabeled)!==api.canonicalPlanLayout(labeled),"placement label changes saved-plan identity");
      result(api.canonicalPlanLayout(labeled)===api.canonicalPlanLayout([{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5,label:"Socks"}]),"same placement label keeps saved-plan identity stable");
      var labels=api.labeledPlacements([
        {typeId:"b1",x:0,y:0,z:0,label:" Socks "},
        {typeId:"b1",x:5,y:0,z:0,label:""},
        {typeId:"b2",x:0,y:5,z:2,label:"Cables"}
      ]);
      result(labels.length===2&&labels[0].label==="Socks"&&labels[1].label==="Cables","label summary trims and excludes blank placement labels");
      result(labels[1].z===2,"label summary preserves stacked placement elevation");
      var printLabels=api.printablePlacementLabels([
        {typeId:"b1",w:20,d:10,h:6,z:0,label:" Socks "},
        {typeId:"b1",w:20,d:10,h:6,z:0,label:""},
        {typeId:"b2",w:12,d:8,h:4,z:6,label:"Cables"}
      ],function(id){return {name:id==="b1"?"Cotton box":"Small tray"}});
      result(printLabels.length===2&&printLabels[0].index===1&&printLabels[1].index===3,"print labels include only purposeful placements while preserving placement numbers");
      result(printLabels[0].purpose==="Socks"&&printLabels[0].itemName==="Cotton box","print labels trim purposes and resolve organizer names");
      result(printLabels[1].z===6&&printLabels[1].w===12&&printLabels[1].d===8&&printLabels[1].h===4,"print labels preserve stacked elevation and dimensions");
      var lockedUpright={w:30,d:20,h:10,uprightOnly:true,floorRotationLocked:true};
      var freeUpright={w:30,d:20,h:10,uprightOnly:true,floorRotationLocked:false};
      result(api.orientations(lockedUpright,true).length===1,"rotation-locked upright items keep one floor orientation");
      result(api.orientations(freeUpright,true).length===2,"unlocked upright items may rotate 90 degrees");
      var tippedLocked={w:30,d:20,h:10,uprightOnly:false,floorRotationLocked:true};
      result(api.orientations(tippedLocked,false).length===3,"rotation lock keeps one footprint orientation for each allowed attitude");
      result(api.maxStackLevelAllows({maxStackLevel:2},2)===true&&api.maxStackLevelAllows({maxStackLevel:2},3)===false,"maximum stack level is enforced");
      result(api.maxStackLevelAllows({maxStackLevel:null},8)===true,"unlimited stack level stays unrestricted");
      var lookup=function(){return {frontPriority:true}};
      var near=[{typeId:"x",y:0,d:2}],far=[{typeId:"x",y:8,d:2}];
      result(api.accessPenalty(near,10,lookup)<api.accessPenalty(far,10,lookup),"front-priority access score prefers shallower placements");
      result(api.compareAccess(near,far,10,lookup)<0,"access comparator ranks front-loaded layout first");
      var noPriority=function(){return {frontPriority:false}};
      result(api.accessPenalty(far,10,noPriority)===0,"items without front priority do not affect access scoring");
      var healthStorage={id:"hs",name:"Health drawer",w:20,d:20,h:10,obstacles:[],dividers:[]};
      var healthItem={id:"hb",name:"Health bin",w:5,d:5,h:5,uprightOnly:true,floorRotationLocked:false,frontPriority:false,canBeStacked:false,canSupportStack:false,maxStackLevel:null};
      var healthPlan={
        id:"hp",storageId:"hs",storageSnapshot:JSON.parse(JSON.stringify(healthStorage)),
        itemSnapshots:{hb:api.itemPlanningSnapshot(healthItem)},
        settings:{clearanceEnabled:false,clearance:0,fitTolerance:0,uprightOnly:true},
        stacking:false,layout:[{typeId:"hb",x:0,y:0,z:0,w:5,d:5,h:5}]
      };
      var healthLookup=function(id){return id==="hb"?healthItem:null};
      result(api.planHealthFromData(healthPlan,healthStorage,healthLookup).status==="current","unchanged saved plan stays current");
      var widerStorage=JSON.parse(JSON.stringify(healthStorage));widerStorage.w=21;
      var reviewHealth=api.planHealthFromData(healthPlan,widerStorage,healthLookup);
      result(reviewHealth.status==="review"&&reviewHealth.canRevalidate===true,"harmless storage change requires review but can revalidate");
      var blockedStorage=JSON.parse(JSON.stringify(healthStorage));blockedStorage.obstacles=[{id:"o",x:0,y:0,w:5,d:5,h:5}];
      result(api.planHealthFromData(healthPlan,blockedStorage,healthLookup).status==="invalid","new obstacle invalidates a colliding saved plan");
      var preferenceItem=JSON.parse(JSON.stringify(healthItem));preferenceItem.frontPriority=true;
      result(api.planHealthFromData(healthPlan,healthStorage,function(){return preferenceItem}).status==="review","handling preference change marks a still-valid plan for review");
      var resizedItem=JSON.parse(JSON.stringify(healthItem));resizedItem.w=6;
      result(api.planHealthFromData(healthPlan,healthStorage,function(){return resizedItem}).status==="invalid","incompatible item dimension change invalidates saved placement");
      var legacy={storages:[{id:"s1",name:"Drawer",w:10,d:10,h:10}],boxes:[{id:"b1",name:"Box",w:5,d:5,h:5}],rooms:[],furniture:[],selectedStorage:"s1"};
      api.ensureHomeHierarchy(legacy);
      result(legacy.rooms.length===1,"legacy data gets a fallback room");
      result(legacy.furniture.length===1,"legacy data gets fallback furniture");
      result(legacy.storages[0].furnitureId===legacy.furniture[0].id,"legacy storage is assigned to fallback furniture");
      result(legacy.selectedRoom===legacy.rooms[0].id&&legacy.selectedFurniture===legacy.furniture[0].id,"hierarchy selection follows the active storage");
      var validDividerBackup={storages:[{id:"s",name:"Drawer",w:10,d:10,h:10,obstacles:[],dividers:[{id:"d",orientation:"vertical",position:5,thickness:.5,h:10}]}],boxes:[{id:"b",name:"Box",w:2,d:2,h:2}],savedPlans:[]};
      result(api.validateBackupState(validDividerBackup)==="","backup validation accepts well-formed dividers");
      var invalidDividerBackup={storages:[{id:"s",name:"Drawer",w:10,d:10,h:10,dividers:[{id:"d",orientation:"diagonal",position:5,thickness:.5,h:10}]}],boxes:[{id:"b",name:"Box",w:2,d:2,h:2}]};
      result(api.validateBackupState(invalidDividerBackup)!=="","backup validation rejects invalid divider direction");
      var invalidStackBackup={storages:[{id:"s",name:"Drawer",w:10,d:10,h:10}],boxes:[{id:"b",name:"Box",w:2,d:2,h:2,maxStackLevel:10}]};
      result(api.validateBackupState(invalidStackBackup)!=="","backup validation rejects stack levels above the supported range");
      var invalidSnapshotBackup={storages:[{id:"s",name:"Drawer",w:10,d:10,h:10}],boxes:[{id:"b",name:"Box",w:2,d:2,h:2}],savedPlans:[{id:"p",storageId:"s",itemSnapshots:[]} ]};
      result(api.validateBackupState(invalidSnapshotBackup)!=="","backup validation rejects malformed saved-plan item snapshots");
      var recoveryRows=[];
      for(var ri=0;ri<10;ri++)recoveryRows.push({id:"r"+ri,createdAt:"2026-09-"+String(10+ri).padStart(2,"0")+"T10:00:00Z",reason:"Checkpoint "+ri,data:{storages:[],boxes:[],savedPlans:[]}});
      recoveryRows.push(null,{id:"bad",createdAt:"bad",reason:"Missing data"});
      recoveryRows.push({id:"r9",createdAt:"2026-10-01T10:00:00Z",reason:"Duplicate newer",data:{storages:[],boxes:[],savedPlans:[]}});
      var normalizedRecovery=api.normalizeRecoveryJournal(recoveryRows);
      result(normalizedRecovery.length===8,"recovery journal keeps only the latest 8 valid checkpoints");
      result(normalizedRecovery[0].id==="r9"&&normalizedRecovery[0].reason==="Duplicate newer","recovery journal sorts newest first and deduplicates IDs");
      result(normalizedRecovery.every(function(x){return x.data&&typeof x.reason==="string"}),"recovery journal filters malformed entries");
      var recoveryMeta=api.recoveryEntryMeta({data:{storages:[{},{}],boxes:[{}],savedPlans:[{},{},{}]}});
      result(recoveryMeta.storages===2&&recoveryMeta.items===1&&recoveryMeta.plans===3,"recovery checkpoint summary counts project contents");
      var sharedPayload={v:1,n:"Tiroir Écharpes",u:"cm",g:"Best use of space",k:false,d:[67,26,13],z:[67,26,13],c:0,t:0,r:42.5,q:"usable floor",o:[[1,30,0,.5,26,13]],i:[["b1","Boîte coton"]],p:[["b1",0,0,0,20,13,10,"Écharpes / أوشحة"]]};
      result(api.validateSharePayload(sharedPayload)==="","share payload validation accepts a well-formed plan");
      var sharedEncoded=api.encodeSharePayload(sharedPayload),sharedDecoded=api.decodeSharePayload(sharedEncoded);
      result(!sharedDecoded.error&&sharedDecoded.payload.p[0][7]==="Écharpes / أوشحة","share links preserve Unicode names and placement labels");
      result(api.base64UrlDecodeUtf8(api.base64UrlEncodeUtf8("é ✓ مرحبا"))==="é ✓ مرحبا","share link UTF-8 base64url round trip");
      var brokenShare=JSON.parse(JSON.stringify(sharedPayload));brokenShare.p[0][0]="missing";
      result(api.validateSharePayload(brokenShare)!=="","share payload validation rejects placements with unknown item IDs");
      result(api.decodeSharePayload("not-valid-base64").error!=="","damaged share payload is rejected safely");
      result(api.defaultEditSnapStep("cm")===0.5&&api.defaultEditSnapStep("mm")===5&&api.defaultEditSnapStep("in")===0.2,"manual edit snap defaults preserve a practical physical scale across units");
      result(api.snapValue(1.24,0.5)===1&&api.snapValue(1.26,0.5)===1.5,"manual edit snapping rounds to the configured step");
      result(api.snapValue(0.037,0.01)===0.04,"manual edit snapping preserves fine precision");
      result(api.clampSnappedValue(9.9,0,9,0.5)===9&&api.clampSnappedValue(-1,0,9,0.5)===0,"manual edit snapping respects storage bounds");
      result(api.defaultConstraintMeasure("cm")===1&&api.defaultConstraintMeasure("mm")===10&&api.defaultConstraintMeasure("in")===0.4,"constraint templates use practical unit-aware defaults");
      var constraintSeq=0,constraintIds=function(prefix){constraintSeq+=1;return prefix+"-"+constraintSeq};
      var templateStorage={w:100,d:50,h:20};
      var runners=api.constraintTemplateZones("side-runners",templateStorage,{width:5,height:8},constraintIds);
      result(runners.length===2&&runners[0].x===0&&runners[0].w===5&&runners[1].x===95&&runners[1].w===5,"side-runner template creates mirrored full-depth rails");
      result(runners.every(function(x){return x.d===50&&x.h===8})&&runners[0].id!==runners[1].id,"side-runner template preserves height and generates fresh IDs");
      var clampedRunners=api.constraintTemplateZones("side-runners",templateStorage,{width:80,height:50},constraintIds);
      result(clampedRunners[0].w===50&&clampedRunners[0].h===20,"side-runner template clamps width and height to storage bounds");
      var rear=api.constraintTemplateZones("rear-strip",templateStorage,{depth:7,height:10},constraintIds);
      result(rear.length===1&&rear[0].x===0&&rear[0].y===43&&rear[0].w===100&&rear[0].d===7,"rear obstruction template anchors to the inside back edge");
      var front=api.constraintTemplateZones("front-strip",templateStorage,{depth:6,height:4},constraintIds);
      result(front.length===1&&front[0].x===0&&front[0].y===0&&front[0].w===100&&front[0].d===6,"front lip template anchors to the inside front edge");
      var corners=api.constraintTemplateZones("corner-posts",templateStorage,{width:4,depth:3,height:12},constraintIds);
      result(corners.length===4&&corners.some(function(x){return x.x===96&&x.y===47})&&corners.every(function(x){return x.w===4&&x.d===3&&x.h===12}),"corner template creates four symmetric editable notches");
      result(api.constraintTemplateZones("unknown",templateStorage,{},constraintIds).length===0,"unknown constraint template produces no geometry");
      var reverseFitItem={id:"rf",name:"Long tray",w:20,d:10,h:5,uprightOnly:true,floorRotationLocked:false};
      var reverseFitSettings={clearanceEnabled:false,clearance:0,fitTolerance:0,uprightOnly:true};
      var rotatedFit=api.itemFitInStorage(reverseFitItem,{id:"rfs",name:"Narrow shelf",w:12,d:21,h:6,obstacles:[],dividers:[]},reverseFitSettings);
      result(!!rotatedFit&&rotatedFit.w===10&&rotatedFit.d===20,"reverse fit lookup rotates an upright item when the original footprint does not fit");
      var fullyBlocked={id:"rfb",name:"Blocked",w:30,d:30,h:6,obstacles:[{id:"o",x:0,y:0,w:30,d:30,h:6}],dividers:[]};
      result(api.itemFitInStorage(reverseFitItem,fullyBlocked,reverseFitSettings)===null,"reverse fit lookup respects full-height blocked zones");
      var dividedFit={id:"rfd",name:"Divided",w:20,d:10,h:6,obstacles:[],dividers:[{id:"d",orientation:"vertical",position:10,thickness:1,h:6}]};
      var squareFitItem={id:"sq",name:"Square bin",w:10,d:10,h:5,uprightOnly:true,floorRotationLocked:false};
      result(api.itemFitInStorage(squareFitItem,dividedFit,reverseFitSettings)===null,"reverse fit lookup respects full-height dividers");
      var clearanceStorage={id:"rfc",name:"Clearance drawer",w:12,d:12,h:6,obstacles:[],dividers:[]};
      result(!!api.itemFitInStorage(squareFitItem,clearanceStorage,{clearanceEnabled:true,clearance:1,fitTolerance:0,uprightOnly:true}),"reverse fit lookup accepts an exact fit after wall clearance");
      result(api.itemFitInStorage(squareFitItem,clearanceStorage,{clearanceEnabled:true,clearance:1.1,fitTolerance:0,uprightOnly:true})===null,"reverse fit lookup rejects storage made too small by wall clearance");
      var reverseMatches=api.compatibleStoragesForItem(reverseFitItem,[
        {id:"large",name:"Large",w:40,d:40,h:10,obstacles:[],dividers:[]},
        {id:"tight",name:"Tight",w:12,d:21,h:6,obstacles:[],dividers:[]}
      ],reverseFitSettings);
      result(reverseMatches.length===2&&reverseMatches[0].storageId==="tight","compatible-space lookup ranks tighter valid spaces first");
      var fourCapacity=api.maxFloorCopiesInStorage(squareFitItem,{id:"cap4",name:"Four",w:20,d:20,h:6,obstacles:[],dividers:[]},reverseFitSettings,{nodeLimit:5000,copyLimit:20});
      result(fourCapacity.count===4&&fourCapacity.exact===true,"capacity finder computes an exact four-item floor maximum");
      var mixedCapacity=api.maxFloorCopiesInStorage({id:"mix",name:"Mixed rectangle",w:6,d:4,h:2,uprightOnly:true,floorRotationLocked:false},{id:"capmix",name:"Mixed orientation",w:10,d:10,h:3,obstacles:[],dividers:[]},reverseFitSettings,{nodeLimit:10000,copyLimit:20});
      result(mixedCapacity.count===4&&mixedCapacity.exact===true&&mixedCapacity.layout.some(function(p){return p.w===6})&&mixedCapacity.layout.some(function(p){return p.w===4}),"capacity finder mixes allowed rotations to improve packing");
      var obstacleCapacity=api.maxFloorCopiesInStorage(squareFitItem,{id:"capobs",name:"Split",w:25,d:10,h:6,obstacles:[{id:"o",x:10,y:0,w:5,d:10,h:6}],dividers:[]},reverseFitSettings,{nodeLimit:5000,copyLimit:20});
      result(obstacleCapacity.count===2&&obstacleCapacity.exact===true,"capacity finder packs around blocked geometry");
      var toleranceCapacity=api.maxFloorCopiesInStorage(squareFitItem,{id:"captol",name:"Gap",w:22,d:12,h:6,obstacles:[],dividers:[]},{clearanceEnabled:false,clearance:0,fitTolerance:1,uprightOnly:true},{nodeLimit:5000,copyLimit:20});
      result(toleranceCapacity.count===1&&toleranceCapacity.exact===true,"capacity finder applies wall and between-item fit tolerance");
      var cappedCapacity=api.maxFloorCopiesInStorage({id:"tiny",name:"Tiny",w:1,d:1,h:1,uprightOnly:true,floorRotationLocked:false},{id:"huge",name:"Huge",w:100,d:100,h:2,obstacles:[],dividers:[]},reverseFitSettings,{nodeLimit:5000,copyLimit:3});
      result(cappedCapacity.count===3&&cappedCapacity.capped===true&&cappedCapacity.exact===false,"capacity finder reports a lower bound when the copy safety cap is reached");
      var mirroredStorage={w:100,d:50,h:20,obstacles:[
        {id:"o1",name:"Left rail",x:5,y:4,w:10,d:8,h:7}
      ],dividers:[
        {id:"dv",orientation:"vertical",position:25,thickness:1,h:20},
        {id:"dh",orientation:"horizontal",position:15,thickness:1,h:20}
      ]};
      var mirrorConstraintsX=api.mirrorStorageConstraintsData(mirroredStorage,"x");
      result(mirrorConstraintsX.obstacles[0].x===85&&mirrorConstraintsX.obstacles[0].y===4,"left-right constraint mirror reflects blocked-zone X");
      result(mirrorConstraintsX.dividers[0].position===75&&mirrorConstraintsX.dividers[1].position===15,"left-right constraint mirror reflects only vertical divider positions");
      result(mirrorConstraintsX.obstacles[0].id==="o1"&&mirrorConstraintsX.dividers[0].id==="dv","constraint mirroring preserves IDs for the same storage");
      var mirrorConstraintsY=api.mirrorStorageConstraintsData(mirroredStorage,"y");
      result(mirrorConstraintsY.obstacles[0].y===38&&mirrorConstraintsY.obstacles[0].x===5,"front-back constraint mirror reflects blocked-zone Y");
      result(mirrorConstraintsY.dividers[1].position===35&&mirrorConstraintsY.dividers[0].position===25,"front-back constraint mirror reflects only horizontal divider positions");
      var mirrorConstraintsTwice=api.mirrorStorageConstraintsData({...mirroredStorage,obstacles:mirrorConstraintsX.obstacles,dividers:mirrorConstraintsX.dividers},"x");
      result(JSON.stringify(mirrorConstraintsTwice.obstacles)===JSON.stringify(mirroredStorage.obstacles)&&JSON.stringify(mirrorConstraintsTwice.dividers)===JSON.stringify(mirroredStorage.dividers),"mirroring constraints twice restores the exact geometry");
      result(api.mirrorStorageConstraintsData(mirroredStorage,"diagonal")===null,"unknown storage-constraint mirror axis is rejected safely");
      var mirrorSource=[
        {typeId:"b1",x:10,y:5,z:0,w:20,d:10,h:6,label:"Left"},
        {typeId:"b1",x:10,y:5,z:6,w:20,d:10,h:6,label:"Top"}
      ];
      var mirrorX=api.mirrorLayoutGeometry(mirrorSource,100,50,"x");
      result(mirrorX[0].x===70&&mirrorX[0].y===5&&mirrorX[1].x===70,"left-right mirror reflects X while preserving stacked alignment");
      result(mirrorX[0].label==="Left"&&mirrorX[1].z===6&&mirrorX[0].w===20&&mirrorX[0].d===10,"mirror preserves labels elevation and organizer orientation");
      var mirrorY=api.mirrorLayoutGeometry(mirrorSource,100,50,"y");
      result(mirrorY[0].x===10&&mirrorY[0].y===35,"front-back mirror reflects Y inside the usable depth");
      var mirrorTwice=api.mirrorLayoutGeometry(mirrorX,100,50,"x");
      result(JSON.stringify(mirrorTwice)===JSON.stringify(mirrorSource),"mirroring twice on the same axis restores the exact layout");
      result(api.footprintContains(mirrorX[0],mirrorX[1])===true,"mirroring a stacked pair preserves full-footprint support geometry");
      result(api.mirrorLayoutGeometry(mirrorSource,100,50,"diagonal").length===0,"unknown mirror axis is rejected safely");
      var history=api.makeEditHistory([{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5,label:""}]);
      result(history.entries.length===1&&history.index===0,"manual edit history starts with one baseline snapshot");
      history=api.appendEditHistoryState(history,[{typeId:"b1",x:1,y:0,z:0,w:5,d:5,h:5,label:""}],"Move");
      history=api.appendEditHistoryState(history,[{typeId:"b1",x:2,y:0,z:0,w:5,d:5,h:5,label:""}],"Nudge");
      result(history.entries.length===3&&history.index===2,"manual edit history appends successful mutations");
      var undoStep=api.stepEditHistoryState(history,-1);
      result(undoStep.moved&&undoStep.layout[0].x===1&&undoStep.history.index===1,"undo restores the previous exact layout snapshot");
      var redoStep=api.stepEditHistoryState(undoStep.history,1);
      result(redoStep.moved&&redoStep.layout[0].x===2&&redoStep.history.index===2,"redo restores the next exact layout snapshot");
      var branched=api.appendEditHistoryState(undoStep.history,[{typeId:"b1",x:9,y:0,z:0,w:5,d:5,h:5,label:""}],"Branch");
      result(branched.entries.length===3&&branched.entries[2].layout[0].x===9,"new edit after undo discards the old redo branch");
      result(api.stepEditHistoryState(branched,1).moved===false,"redo is unavailable after branching from an undone state");
      var deduped=api.appendEditHistoryState(branched,[{typeId:"b1",x:9,y:0,z:0,w:5,d:5,h:5,label:""}],"Duplicate snapshot");
      result(deduped.entries.length===branched.entries.length,"identical snapshots do not create duplicate undo steps");
      var capped=api.makeEditHistory([{x:0}]);
      for(var hi=1;hi<=5;hi++)capped=api.appendEditHistoryState(capped,[{x:hi}],"Edit "+hi,3);
      result(capped.entries.length===3&&capped.entries[capped.index].layout[0].x===5,"manual edit history respects its bounded capacity");
      var replaceSource={w:30,d:20,h:10};
      var replaceTarget={id:"rt",name:"Replacement",w:28,d:19,h:10,uprightOnly:true,floorRotationLocked:false};
      var replaceOris=api.replacementOrientationCandidates(replaceSource,replaceTarget,true);
      result(replaceOris.length===2&&replaceOris[0].w===28&&replaceOris[0].d===19,"replacement prefers the orientation closest to the existing footprint");
      result(replaceOris[0].score<replaceOris[1].score,"replacement orientation ranking minimizes dimension change");
      var lockedReplace={id:"rl",name:"Locked",w:28,d:19,h:10,uprightOnly:true,floorRotationLocked:true};
      var lockedOris=api.replacementOrientationCandidates(replaceSource,lockedReplace,true);
      result(lockedOris.length===1&&lockedOris[0].w===28&&lockedOris[0].d===19,"replacement respects floor rotation locks");
      result(api.replacementOrientationCandidates(null,replaceTarget,true).length===0,"replacement orientation helper rejects missing source safely");
      var coordinateSource={typeId:"b1",x:1.23456789,y:2,z:3,w:5,d:6,h:7,label:"Socks"};
      var coordinateX=api.placementCoordinateCandidate(coordinateSource,"x",9.87654321);
      result(coordinateX.x===9.876543&&coordinateX.y===2&&coordinateX.z===3,"exact coordinate helper changes only the selected axis with stable precision");
      result(coordinateX.label==="Socks"&&coordinateX.w===5&&coordinateX.d===6&&coordinateX.h===7,"exact coordinate edits preserve placement identity dimensions and labels");
      var coordinateZero=api.placementCoordinateCandidate(coordinateSource,"z",0);
      result(coordinateZero.z===0,"exact coordinate helper accepts floor elevation zero");
      result(api.placementCoordinateCandidate(coordinateSource,"q",4)===null,"exact coordinate helper rejects unknown axes");
      result(api.placementCoordinateCandidate(coordinateSource,"x","not-a-number")===null,"exact coordinate helper rejects nonnumeric values");
      result(api.placementCoordinateCandidate(null,"x",1)===null,"exact coordinate helper rejects missing placements safely");
      var alignSource={typeId:"b1",x:23,y:17,z:0,w:20,d:10,h:5,label:"Socks"};
      var alignLeft=api.alignmentPlacementCandidate(alignSource,"left",100,50,2);
      result(alignLeft.x===2&&alignLeft.y===17,"left alignment uses fit tolerance as the edge inset");
      var alignRight=api.alignmentPlacementCandidate(alignSource,"right",100,50,2);
      result(alignRight.x===78&&alignRight.y===17,"right alignment uses the usable width and edge inset");
      var alignCenterX=api.alignmentPlacementCandidate(alignSource,"center-x",100,50,2);
      result(alignCenterX.x===40&&alignCenterX.y===17,"horizontal center alignment centers the organizer exactly");
      var alignFront=api.alignmentPlacementCandidate(alignSource,"front",100,50,3);
      var alignBack=api.alignmentPlacementCandidate(alignSource,"back",100,50,3);
      result(alignFront.y===3&&alignBack.y===37,"front and back alignment use the usable depth and tolerance inset");
      var alignCenterY=api.alignmentPlacementCandidate(alignSource,"center-y",100,50,2);
      result(alignCenterY.y===20&&alignCenterY.x===23,"depth center alignment changes only Y");
      result(alignCenterY.label==="Socks"&&alignCenterY.z===0,"alignment preserves labels and elevation");
      result(api.alignmentPlacementCandidate(alignSource,"diagonal",100,50,0)===null,"unknown alignment is rejected safely");
    }catch(e){
      result(false,"test harness exception",e.message);
    }finally{
      localStorage.clear();
      Object.keys(backup).forEach(function(key){localStorage.setItem(key,backup[key]);});
    }

    var pass=rows.filter(function(x){return x.ok;}).length;
    var html="<p><strong>"+pass+"/"+rows.length+" passed</strong></p><ul>";
    html+=rows.map(function(r){
      return '<li class="'+(r.ok?"pass":"fail")+'">'+(r.ok?"✓":"✗")+" "+r.name+(r.detail?" — <code>"+r.detail+"</code>":"")+"</li>";
    }).join("");
    html+="</ul>";
    document.getElementById("results").innerHTML=html;
  },{once:true});
})();
</script>
