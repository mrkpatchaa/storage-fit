<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storage Fit Smoke Tests</title>
  <style>
    body{font:15px/1.5 system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
    .pass{color:#176b45}.fail{color:#a13232}code{background:#f3f3ef;padding:2px 5px;border-radius:5px}
    iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <h1>Storage Fit smoke tests</h1>
  <p>Loads the real app and checks core browser-side helpers without a build step.</p>
  <div id="results">Running…</div>
  <iframe id="app" src="../index.html?smoke-test=1"></iframe>
<script>
(function(){
  var backup={};
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);backup[k]=localStorage.getItem(k);}
  localStorage.clear();

  var rows=[];
  function result(ok,name,detail){rows.push({ok:ok,name:name,detail:detail||""});}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}

  var frame=document.getElementById("app");
  frame.addEventListener("load",function(){
    var w=frame.contentWindow;
    try{
      var api=w.StorageFitTest;
      result(!!api,"smoke-test API is exposed only for the test page");
      result(same(api.parseDimensionString("38 x 76 x 30 cm"),[38,76,30]),"compact dimensions");
      result(same(api.parseLabeledDimensions("Width: 38 cm Depth: 76 cm Height: 30 cm"),[38,76,30]),"IKEA labeled dimensions");
      result(same(api.parseLabeledDimensions("Largeur 38 cm Profondeur 76 cm Hauteur 30 cm"),[38,76,30]),"French labeled dimensions");
      result(api.normalizedSku("405.220.88")==="40522088","SKU punctuation normalization");
      var tracked="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/?utm_source=test#details";
      var clean="https://www.ikea.com/ma/en/p/sockerbit-storage-box-with-lid-white-40522088/";
      result(api.canonicalProductUrl(tracked)===api.canonicalProductUrl(clean),"tracking URLs canonicalize to one product");
      result(api.retailerName(clean)==="IKEA","retailer detection");
      var info=api.ikeaUrlInfo(clean);
      result(info.sku==="405.220.88","IKEA article number",info.sku||"missing");
      result(same(api.normalizeProductDimensions([380,760,300],"mm"),[38,76,30]),"unit conversion mm to cm");
      result(api.safeUrl("javascript:alert(1)")==="","unsafe URL rejection");
      var valid={storages:[{id:"s",name:"Drawer",w:67,d:26,h:13,obstacles:[]}],boxes:[{id:"b",name:"Box",w:10,d:10,h:5}],savedPlans:[]};
      result(api.validateBackupState(valid)==="","backup validation accepts valid state");
      result(api.validateBackupState({storages:"bad",boxes:[]})!=="","backup validation rejects invalid state");
      var validSessionBackup={...valid,ownedDistributionSessions:{b:{itemId:"b",allocations:[{storageId:"s",status:"opened",result:{layout:[]}}]}}};
      result(api.validateBackupState(validSessionBackup)==="","backup validation accepts persisted owned-distribution sessions");
      var invalidSessionBackup={...valid,ownedDistributionSessions:{b:{itemId:"b",allocations:[{storageId:"s",status:"opened",result:{}}]}}};
      result(api.validateBackupState(invalidSessionBackup)!=="","backup validation rejects malformed owned-distribution packing data");

      var base={x:0,y:0,z:0,w:20,d:20,h:10};
      var touching={x:2,y:2,z:10,w:10,d:10,h:5};
      var colliding={x:2,y:2,z:9,w:10,d:10,h:5};
      var overhang={x:15,y:2,z:10,w:10,d:10,h:5};
      result(api.overlap3D(base,touching,0)===false,"stacked faces may touch vertically");
      result(api.overlap3D(base,colliding,0)===true,"3D overlap detects vertical penetration");
      result(api.footprintContains(base,touching)===true,"full-footprint support accepted");
      result(api.footprintContains(base,overhang)===false,"overhanging stack rejected");
      var stock=api.purchaseBreakdown(5,2,30);
      result(stock.ownedUsed===2&&stock.buyQty===3&&stock.subtotal===90,"owned inventory reduces purchase quantity");
      var covered=api.purchaseBreakdown(3,5,30);
      result(covered.ownedUsed===3&&covered.buyQty===0&&covered.subtotal===0,"owned inventory can fully cover a layout");
      var stockCommit=api.itemStockStatus("b1",5,[
        {id:"p1",layout:[{typeId:"b1"},{typeId:"b1"}]},
        {id:"p2",layout:[{typeId:"b1"}]},
        {id:"p3",layout:[{typeId:"b2"}]}
      ]);
      result(stockCommit.required===3&&stockCommit.committedOwned===3&&stockCommit.unallocatedOwned===2&&stockCommit.shortage===0&&stockCommit.planCount===2,"item stock status reports committed and unallocated owned copies");
      var stockShort=api.itemStockStatus("b1",2,[
        {id:"p1",layout:[{typeId:"b1"},{typeId:"b1"},{typeId:"b1"}]},
        {id:"p2",layout:[{typeId:"b1"},{typeId:"b1"}]}
      ]);
      result(stockShort.required===5&&stockShort.committedOwned===2&&stockShort.unallocatedOwned===0&&stockShort.shortage===3,"item stock status reports chosen-plan shortage");
      var filteredStock=api.itemStockStatus("b1",4,[
        {id:"current",layout:[{typeId:"b1"},{typeId:"b1"}]},
        {id:"stale",layout:[{typeId:"b1"},{typeId:"b1"},{typeId:"b1"}]}
      ],function(plan){return plan.id!=="stale";});
      result(filteredStock.required===2&&filteredStock.unallocatedOwned===2&&filteredStock.planCount===1,"item stock status can exclude stale chosen plans");
      var basePlan={id:"base-plan",name:"Original plan",storageId:"s1",savedAt:"2026-09-29T10:00:00.000Z"};
      var sourceSnapshot=api.savedPlanSourceSnapshot(basePlan);
      result(sourceSnapshot.planId==="base-plan"&&sourceSnapshot.name==="Original plan"&&sourceSnapshot.storageId==="s1","saved-plan source snapshot captures parent identity");
      var lineageMeta=api.planLineageMetadata(sourceSnapshot);
      result(lineageMeta.derivedFromPlanId==="base-plan"&&lineageMeta.derivedFromName==="Original plan","revision lineage metadata preserves parent id and fallback name");
      var childPlan={id:"child-plan",name:"Revision",storageId:"s1",...lineageMeta};
      var liveLineage=api.planLineageInfo(childPlan,[{...basePlan,name:"Renamed original"}]);
      result(liveLineage.sourceExists===true&&liveLineage.name==="Renamed original"&&liveLineage.label==="Based on Renamed original","lineage display follows a live parent rename");
      var removedLineage=api.planLineageInfo(childPlan,[]);
      result(removedLineage.sourceExists===false&&removedLineage.name==="Original plan"&&removedLineage.label.indexOf("source removed")>0,"lineage display survives parent deletion using the saved name snapshot");
      result(api.planLineageInfo({id:"root"},[])===null,"root saved plans have no lineage label");
      var familyPlans=[
        {id:"root-plan",name:"Root",storageId:"s1",savedAt:"2026-09-29T09:00:00.000Z"},
        {id:"child-b",name:"Child B",storageId:"s1",savedAt:"2026-09-29T11:00:00.000Z",derivedFromPlanId:"root-plan",derivedFromName:"Root"},
        {id:"child-a",name:"Child A",storageId:"s1",savedAt:"2026-09-29T10:00:00.000Z",derivedFromPlanId:"root-plan",derivedFromName:"Root"}
      ];
      var rootFamily=api.planFamilyInfo("root-plan",familyPlans);
      result(rootFamily.parent===null&&rootFamily.visibleCount===3&&rootFamily.children.map(function(p){return p.id;}).join(",")==="child-a,child-b","plan family groups and orders direct revisions");
      var childFamily=api.planFamilyInfo("child-a",familyPlans);
      result(childFamily.parent.id==="root-plan"&&childFamily.children.length===0&&childFamily.visibleCount===2,"plan family exposes the immediate parent for a revision");
      var orphanFamily=api.planFamilyInfo("child-a",familyPlans.filter(function(p){return p.id!=="root-plan";}));
      result(orphanFamily.parent.removed===true&&orphanFamily.parent.name==="Root"&&orphanFamily.visibleCount===2,"plan family preserves a removed parent placeholder");
      result(api.planFamilyInfo("missing",familyPlans)===null,"plan family rejects unknown plan ids");
      var choiceState={
        savedPlans:[
          {id:"chosen-old",storageId:"s1",layout:[{typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:"Socks"}]},
          {id:"revision-new",storageId:"s1",layout:[{typeId:"b1",x:2,y:0,z:0,w:10,d:10,h:5,label:"Socks"}]},
          {id:"revision-label",storageId:"s1",layout:[{typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:"Cables"}]},
          {id:"other-storage",storageId:"s2",layout:[]}
        ],
        chosenPlanIds:{s1:"chosen-old"},
        installedPlanIds:{s1:"chosen-old"}
      };
      var revisionImpact=api.planChoiceImpact("revision-new",choiceState);
      result(revisionImpact.previousChosenId==="chosen-old"&&revisionImpact.previousInstalledId==="chosen-old"&&revisionImpact.clearsInstalled===true&&revisionImpact.preservesInstalled===false&&revisionImpact.alreadyChosen===false,"physical revision promotion reports when switching clears an installed marker");
      var labelImpact=api.planChoiceImpact("revision-label",choiceState);
      result(labelImpact.clearsInstalled===false&&labelImpact.preservesInstalled===true,"label-only revision promotion preserves the installed marker");
      var carriedChoice=JSON.parse(JSON.stringify(choiceState));
      result(api.carryInstalledPlanForward(carriedChoice,labelImpact)===true&&carriedChoice.installedPlanIds.s1==="revision-label","installed marker transfers to a physically equivalent chosen revision");
      var chosenImpact=api.planChoiceImpact("chosen-old",choiceState);
      result(chosenImpact.alreadyChosen===true&&chosenImpact.clearsInstalled===false&&chosenImpact.preservesInstalled===false,"already chosen family member does not require re-installation");
      var freshImpact=api.planChoiceImpact("other-storage",choiceState);
      result(freshImpact.previousChosenId===""&&freshImpact.previousInstalledId===""&&freshImpact.clearsInstalled===false&&freshImpact.preservesInstalled===false,"choosing a plan for an untouched storage has no installation impact");
      result(api.planChoiceImpact("missing",choiceState)===null,"plan choice impact rejects unknown plan ids");
      result(api.physicalPlanEquivalent(
        {storageId:"s1",layout:[{typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:"A"},{typeId:"b1",x:10,y:0,z:0,w:10,d:10,h:5,label:"B"}]},
        {storageId:"s1",layout:[{typeId:"b1",x:10,y:0,z:0,w:10,d:10,h:5,label:"Renamed"},{typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:"Other"}]}
      )===true,"physical equivalence ignores labels and placement array order");
      result(api.physicalPlanEquivalent(
        {storageId:"s1",layout:[{typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5}]},
        {storageId:"s1",layout:[{typeId:"b1",x:0,y:0,z:0,w:10,d:5,h:10}]}
      )===false,"physical equivalence treats orientation changes as requiring installation");
      var deltaBefore=[
        {typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:""},
        {typeId:"b1",x:10,y:0,z:0,w:10,d:10,h:5,label:"Socks"},
        {typeId:"b2",x:0,y:10,z:0,w:6,d:4,h:3,label:""},
        {typeId:"b3",x:20,y:0,z:0,w:5,d:5,h:5,label:""}
      ];
      var deltaAfter=[
        {typeId:"b1",x:0,y:0,z:0,w:10,d:10,h:5,label:""},
        {typeId:"b1",x:12,y:0,z:0,w:10,d:10,h:5,label:"Cables"},
        {typeId:"b2",x:0,y:10,z:0,w:4,d:6,h:3,label:""},
        {typeId:"new-type",x:20,y:0,z:0,w:5,d:5,h:5,label:""}
      ];
      var placementDelta=api.placementDeltaSummary(deltaBefore,deltaAfter);
      result(placementDelta.unchanged===1&&placementDelta.changed===2&&placementDelta.added===1&&placementDelta.removed===1,"revision delta separates unchanged changed added and removed placements");
      result(placementDelta.moved===1&&placementDelta.reoriented===1&&placementDelta.relabeled===1&&placementDelta.quantityDelta===0,"revision delta detects move orientation and label changes without double-counting quantity");
      var deltaText=api.revisionDeltaText({placements:placementDelta,utilizationDelta:3.25,purchaseUnitsDelta:-1,costDelta:null});
      result(deltaText.indexOf("+1 added")>=0&&deltaText.indexOf("-1 removed")>=0&&deltaText.indexOf("1 moved")>=0&&deltaText.indexOf("+3.3 pp utilization")>=0&&deltaText.indexOf("-1 units to buy")>=0,"revision delta text summarizes physical utilization and purchase changes");
      var noChangeDelta=api.placementDeltaSummary(deltaBefore,deltaBefore.map(function(p){return {...p};}));
      result(noChangeDelta.unchanged===4&&noChangeDelta.changed===0&&noChangeDelta.added===0&&noChangeDelta.removed===0,"revision delta recognizes an identical layout");
      var deltaDetails=api.placementDeltaDetails(deltaBefore,deltaAfter);
      result(deltaDetails.before[0].status==="unchanged"&&deltaDetails.before[1].status==="modified"&&deltaDetails.before[2].status==="modified"&&deltaDetails.before[3].status==="removed","revision visual details classify parent placements for highlighting");
      result(deltaDetails.after[0].status==="unchanged"&&deltaDetails.after[1].status==="modified"&&deltaDetails.after[2].status==="modified"&&deltaDetails.after[3].status==="added","revision visual details classify revision placements for highlighting");
      result(deltaDetails.before[1].partnerIndex===1&&deltaDetails.after[1].partnerIndex===1&&deltaDetails.before[1].moved&&deltaDetails.before[1].relabeled,"revision visual details preserve matched-copy change flags");
      var previewPlan={
        storageId:"snapshot-storage",
        storageSnapshot:{id:"snapshot-storage",name:"Saved drawer",w:32,d:22,h:8,obstacles:[],dividers:[]},
        settings:{clearanceEnabled:true,clearance:1,unit:"cm"},
        layout:[{typeId:"b1",name:"Box",x:0,y:0,z:0,w:10,d:10,h:5,label:""}]
      };
      var previewSnap=api.planPreviewSnapshot(previewPlan);
      result(previewSnap.W===30&&previewSnap.D===20&&previewSnap.unit==="cm","revision preview geometry uses the saved storage snapshot and saved clearance");
      var previewSvg=api.savedPlanTopPreview(previewPlan,[{index:0,status:"added"}],240,160);
      result(previewSvg.indexOf('class="revisionpreviewsvg"')>=0&&previewSvg.indexOf("#166c45")>=0,"revision preview renders machine-tested added-placement highlighting");
      var shoppingState={shoppingBought:{b1:3.9,b2:-2,b3:"4"}};
      api.normalizeShoppingBought(shoppingState);
      result(shoppingState.shoppingBought.b1===3&&shoppingState.shoppingBought.b3===4&&!shoppingState.shoppingBought.b2,"shopping progress normalizes to non-negative whole quantities");
      var projectCounts=api.aggregateRequiredCounts([
        {layout:[{typeId:"b1"},{typeId:"b1"},{typeId:"b2"}]},
        {layout:[{typeId:"b1"},{typeId:"b2"},{typeId:"b2"}]}
      ]);
      result(projectCounts.b1===3&&projectCounts.b2===3,"chosen-plan quantities aggregate across storage spaces");
      var legacyChoice={
        savedPlans:[{id:"p1",storageId:"s1"},{id:"p2",storageId:"s2"}],
        chosenPlanId:"p2"
      };
      api.normalizeChosenPlanSelections(legacyChoice);
      result(legacyChoice.chosenPlanIds.s2==="p2"&&!("chosenPlanId" in legacyChoice),"legacy single chosen plan migrates to its storage");
      var installPlans=[
        {id:"p1",storageId:"s1",layout:[{typeId:"b1"},{typeId:"b1"}]},
        {id:"p2",storageId:"s2",layout:[{typeId:"b1"},{typeId:"b1"}]}
      ];
      var firstReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s1","s2"]);
      result(firstReady.entries[0].status==="ready"&&firstReady.entries[1].status==="waiting","install queue allocates limited stock by priority");
      var secondReady=api.computeInstallAllocation(installPlans,{b1:2},{},["s2","s1"]);
      result(secondReady.entries[0].storageId==="s2"&&secondReady.entries[0].status==="ready"&&secondReady.entries[1].status==="waiting","reordering changes which storage is ready");
      var reserved=api.computeInstallAllocation(installPlans,{b1:4},{s1:"p1"},["s1","s2"]);
      result(reserved.entries[0].status==="installed"&&reserved.entries[1].status==="ready","installed plans reserve inventory before ready allocation");
      var installState={
        storages:[{id:"s1"},{id:"s2"}],
        savedPlans:installPlans,
        chosenPlanIds:{s1:"p2",s2:"p2"},
        installedPlanIds:{s1:"p1",s2:"p2"},
        installOrder:["s2","s1","s2"]
      };
      api.normalizeInstallState(installState);
      result(!installState.installedPlanIds.s1&&installState.installedPlanIds.s2==="p2","stale installed status is removed when chosen plan changes");
      result(installState.installOrder.length===2&&installState.installOrder[0]==="s2","install order is deduplicated and keeps chosen storages");
      result(JSON.stringify(api.repeatStorageNames("Drawer",3))===JSON.stringify(["Drawer 2","Drawer 3","Drawer 4"]),"plain storage names repeat with readable numbering");
      result(JSON.stringify(api.repeatStorageNames("Drawer 07",2))===JSON.stringify(["Drawer 08","Drawer 09"]),"numbered storage names preserve zero padding");
      var seq=0,idFactory=function(prefix){seq+=1;return prefix+"-"+seq};
      var storageClone=api.cloneStorageDefinition(
        {id:"s1",name:"Drawer 1",w:67,d:26,h:13,furnitureId:"f1",obstacles:[{id:"o1",name:"Rail",x:1,y:2,w:3,d:4,h:5}]},
        {name:"Drawer 2",idFactory:idFactory}
      );
      result(storageClone.id!=="s1"&&storageClone.name==="Drawer 2","storage clone gets a fresh ID and requested name");
      result(storageClone.obstacles.length===1&&storageClone.obstacles[0].id!=="o1"&&storageClone.obstacles[0].name==="Rail","storage clone deep-copies blocked zones with fresh IDs");
      var dividerStorage={id:"ds",name:"Divider drawer",w:100,d:50,h:12,furnitureId:"f1",obstacles:[],dividers:[
        {id:"dv",orientation:"vertical",position:40,thickness:2,h:10},
        {id:"dh",orientation:"horizontal",position:20,thickness:1,h:8}
      ]};
      var dividerRects=api.dividerRectsForStorage(dividerStorage);
      result(dividerRects.length===2&&dividerRects[0].x===39&&dividerRects[0].w===2&&dividerRects[0].d===50,"vertical divider becomes a centered front-to-back physical wall");
      result(dividerRects[1].y===19.5&&dividerRects[1].d===1&&dividerRects[1].w===100,"horizontal divider becomes a centered left-to-right physical wall");
      var edgeDivider=api.dividerRectsForStorage({id:"edge",w:10,d:10,h:5,dividers:[{id:"d",orientation:"vertical",position:0,thickness:2,h:5}]})[0];
      result(edgeDivider.x===0&&edgeDivider.w===1,"divider thickness is clipped correctly at a storage wall");
      var physical=api.physicalObstaclesForStorage({id:"ps",w:100,d:50,h:12,obstacles:[{id:"o",x:1,y:1,w:2,d:2,h:2}],dividers:dividerStorage.dividers});
      result(physical.length===3&&physical.filter(function(x){return x.kind==="divider"}).length===2,"optimizer geometry combines blocked zones and dividers");
      var seqDivider=0,dividerClone=api.cloneStorageDefinition(dividerStorage,{idFactory:function(prefix){seqDivider+=1;return prefix+"-d"+seqDivider}});
      result(dividerClone.dividers.length===2&&dividerClone.dividers[0].id!=="dv"&&dividerClone.dividers[0].position===40,"storage cloning deep-copies dividers with fresh IDs");
      var seq2=0,idFactory2=function(prefix){seq2+=1;return prefix+"-"+seq2};
      var furnClone=api.cloneFurnitureDefinition(
        {id:"f1",roomId:"r1",name:"Wardrobe"},
        [{id:"s1",name:"Left drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]},{id:"s2",name:"Right drawer",w:10,d:10,h:5,furnitureId:"f1",obstacles:[]}],
        {name:"Wardrobe copy",idFactory:idFactory2}
      );
      result(furnClone.furniture.id!=="f1"&&furnClone.storages.length===2,"furniture clone creates a fresh furniture and all child storage spaces");
      result(furnClone.storages.every(function(x){return x.furnitureId===furnClone.furniture.id}),"cloned storage spaces point to the cloned furniture");
      result(!("savedPlans" in furnClone)&&!furnClone.storages.some(function(x){return "installed" in x||"chosen" in x}),"structural clones do not carry planning or installation completion state");
      var matchSource={id:"s1",furnitureId:"f1",name:"Drawer A",w:67,d:26,h:13,obstacles:[{id:"o1",name:"Left rail",x:0,y:0,w:2,d:26,h:2}]};
      var sameGeometry={id:"s2",furnitureId:"f1",name:"Drawer B",w:67,d:26,h:13,obstacles:[{id:"different",name:"Different label",x:0,y:0,w:2,d:26,h:2}]};
      var changedObstacle={id:"s3",furnitureId:"f1",name:"Drawer C",w:67,d:26,h:13,obstacles:[{id:"o3",name:"Rail",x:0,y:0,w:3,d:26,h:2}]};
      var otherFurniture={id:"s4",furnitureId:"f2",name:"Drawer D",w:67,d:26,h:13,obstacles:[{id:"o4",name:"Rail",x:0,y:0,w:2,d:26,h:2}]};
      result(api.storageStructureSignature(matchSource)===api.storageStructureSignature(sameGeometry),"matching ignores obstacle IDs and labels");
      result(api.storageStructureSignature(matchSource)!==api.storageStructureSignature(changedObstacle),"matching detects obstacle geometry changes");
      var withDivider={id:"sd1",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"d1",orientation:"vertical",position:30,thickness:1,h:13}]};
      var sameDivider={id:"sd2",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"other",orientation:"vertical",position:30,thickness:1,h:13}]};
      var movedDivider={id:"sd3",furnitureId:"f1",w:67,d:26,h:13,obstacles:[],dividers:[{id:"d3",orientation:"vertical",position:31,thickness:1,h:13}]};
      result(api.storageStructureSignature(withDivider)===api.storageStructureSignature(sameDivider),"structural matching ignores divider IDs");
      result(api.storageStructureSignature(withDivider)!==api.storageStructureSignature(movedDivider),"structural matching detects divider geometry changes");
      var siblings=api.matchingSiblingStorages(matchSource,[matchSource,sameGeometry,changedObstacle,otherFurniture]);
      result(siblings.length===1&&siblings[0].id==="s2","propagation targets only structurally identical siblings in the same furniture");
      var unlabeled=[{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5}];
      var labeled=[{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5,label:"Socks"}];
      result(api.canonicalPlanLayout(unlabeled)!==api.canonicalPlanLayout(labeled),"placement label changes saved-plan identity");
      result(api.canonicalPlanLayout(labeled)===api.canonicalPlanLayout([{typeId:"b1",x:0,y:0,z:0,w:5,d:5,h:5,label:"Socks"}]),"same placement label keeps saved-plan identity stable");
      var labels=api.labeledPlacements([
        {typeId:"b1",x:0,y:0,z:0,label:" Socks "},
        {typeId:"b1",x:5,y:0,z:0,label:""},
        {typeId:"b2",x:0,y:5,z:2,label:"Cables"}
      ]);
      result(labels.length===2&&labels[0].label==="Socks"&&labels[1].label==="Cables","label summary trims and excludes blank placement labels");
      result(labels[1].z===2,"label summary preserves stacked placement elevation");
      var printLabels=api.printablePlacementLabels([
        {typeId:"b1",w:20,d:10,h:6,z:0,label:" Socks "},
        {typeId:"b1",w:20,d:10,h:6,z:0,label:""},
        {typeId:"b2",w:12,d:8,h:4,z:6,label:"Cables"}
      ],function(id){return {name:id==="b1"?"Cotton box":"Small tray"}});
      result(printLabels.length===2&&printLabels[0].index===1&&printLabels[1].index===3,"print labels include only purposeful placements while preserving placement numbers");
